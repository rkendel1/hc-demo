name: Linux native compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-native:
    runs-on: ubuntu-latest
    container:
      image: node:22-trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install ELF validation tools
        run: apt-get update && apt-get install --no-install-recommends --yes binutils
      - name: Install the production package
        run: npm ci --include=optional
      - name: Validate the packaged native binding
        run: node --version && ldd --version && npm run validate:native
      - name: Smoke test the native runtime
        run: npm run smoke:native
